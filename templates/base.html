<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Easy Notes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="navbar">
  <a class="brand" href="{{ url_for('index') }}"><span>ASN</span> Easy Notes</a>
  <nav>
    <a href="{{ url_for('index') }}">Notes</a>
  <a class="nav-upload" href="{{ url_for('upload') }}">+ Upload Notes</a>
  <a href="{{ url_for('user_logout') }}">Logout</a>
  </nav>
</header>

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<footer>© 2026 Easy Notes · Your notes, organized.</footer>
</body>
</html>
